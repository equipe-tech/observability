name: observability-local

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/local.yaml"]
    volumes:
      - ../collector/local.yaml:/etc/otelcol/local.yaml:ro
      - ./data:/telemetry
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - viewer

  viewer:
    image: ghcr.io/ctrlspice/otel-desktop-viewer:v0.4.1
    ports:
      - "127.0.0.1:8000:8000"
