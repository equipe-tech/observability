receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    send_batch_size: 512
    timeout: 1s

exporters:
  otlp/viewer:
    endpoint: viewer:4317
    tls:
      insecure: true
  file/telemetry:
    path: /telemetry/otlp.jsonl
    format: json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/viewer, file/telemetry]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/viewer, file/telemetry]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/viewer, file/telemetry]
