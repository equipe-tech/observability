name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      run_deployed_canary:
        default: true
        required: false
        type: boolean
    secrets:
      AXIOM_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Configure the observability state directory
        run: echo "OBSERVABILITY_HOME=${RUNNER_TEMP}/observability" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun check
      - run: bun run build
      - run: bun run test
      - run: bun run test:package
      - run: docker run --rm -v "$PWD/packages/cli/src/assets/local.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector-contrib:0.159.0 validate --config=/etc/otelcol/config.yaml
      - run: docker run --rm -e AXIOM_TOKEN=test -e AXIOM_DATASET_TRACES=traces -e AXIOM_DATASET_LOGS=logs -e AXIOM_DATASET_METRICS=metrics -v "$PWD/packages/cli/src/assets/production.yaml:/etc/otelcol/config.yaml:ro" otel/opentelemetry-collector-contrib:0.159.0 validate --config=/etc/otelcol/config.yaml
      - name: Collector outage, restart, and saturation proof
        timeout-minutes: 3
        env:
          OBSERVABILITY_COLLECTOR_RECOVERY: "1"
          OBSERVABILITY_COLLECTOR_RECOVERY_ARTIFACT_ROOT: ${{ runner.temp }}/collector-recovery
        run: bun test packages/cli/test/CollectorRecovery.bun.test.ts --timeout 120000
      - run: bun packages/cli/src/main.ts dev up
      - run: curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 http://localhost:8000/ > /dev/null
      - run: OBSERVABILITY_E2E=1 bun test:canary
      - if: always()
        run: bun packages/cli/src/main.ts dev down
      - name: deployed canary
        if: ${{ github.event_name != 'workflow_call' || inputs.run_deployed_canary }}
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_DATASET_TRACES: ${{ vars.AXIOM_DATASET_TRACES }}
          AXIOM_DATASET_LOGS: ${{ vars.AXIOM_DATASET_LOGS }}
          AXIOM_DATASET_METRICS: ${{ vars.AXIOM_DATASET_METRICS }}
        run: |
          if [ -z "$AXIOM_TOKEN" ]; then
            echo "Deployed canary skipped: the AXIOM_TOKEN secret is not configured."
            exit 0
          fi
          docker run -d --name otel-production \
            -p 127.0.0.1:24318:4318 \
            -e AXIOM_TOKEN -e AXIOM_DATASET_TRACES -e AXIOM_DATASET_LOGS -e AXIOM_DATASET_METRICS \
            -v "$PWD/packages/cli/src/assets/production.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.159.0 --config=/etc/otelcol/config.yaml
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:24318; then break; fi
            sleep 1
          done
          OBSERVABILITY_E2E_DEPLOYED=1 OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:24318 bun test:canary:deployed
      - if: always()
        run: docker rm -f otel-production 2>/dev/null || true
