name: Release

on:
  push:
    tags:
      - "*@*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de pacote existente, por exemplo observability@0.3.0"
        required: true
        type: string
      confirm_tag:
        description: "Repita exatamente o tag aprovado"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      archive: ${{ steps.meta.outputs.archive }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Validate the scoped package tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          CONFIRM_TAG: ${{ inputs.confirm_tag || '' }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$CONFIRM_TAG" == "$tag" ]] || { echo "Publication confirmation must exactly match $tag."; exit 1; }
            [[ "$EVENT_REF" == "refs/tags/$tag" ]] || { echo "Publication dispatch must run from the exact tag ref refs/tags/$tag."; exit 1; }
          fi
          git show-ref --verify --quiet "refs/tags/$tag" || { echo "The tag $tag does not exist in this checkout."; exit 1; }
          tag_commit="$(git rev-list -n 1 "$tag")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] || { echo "HEAD $head_commit is not the exact commit for $tag ($tag_commit)."; exit 1; }
          bun scripts/release-canary.ts --tag "$tag" --github-output "$GITHUB_OUTPUT"

  verify:
    needs: tag-check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag-check.outputs.tag }}

  deployed-canary:
    needs: [tag-check, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publication
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Resolve release canary identity
        env:
          RELEASE_TAG: ${{ needs.tag-check.outputs.tag }}
        run: bun scripts/release-canary.ts --tag "$RELEASE_TAG" --github-env "$GITHUB_ENV"
      - name: Start the production collector
        env:
          AXIOM_INGEST_TOKEN: ${{ secrets.AXIOM_INGEST_TOKEN }}
          AXIOM_DATASET_TRACES: ${{ vars.AXIOM_DATASET_TRACES }}
          AXIOM_DATASET_LOGS: ${{ vars.AXIOM_DATASET_LOGS }}
          AXIOM_DATASET_METRICS: ${{ vars.AXIOM_DATASET_METRICS }}
        run: |
          set -euo pipefail
          bun scripts/release-canary.ts --require-credential AXIOM_INGEST_TOKEN
          trap 'status=$?; if [[ "$status" != 0 ]]; then docker inspect --format "{{json .State}}" otel-production || true; docker logs --tail 100 otel-production || true; fi' EXIT
          queue_directory="${RUNNER_TEMP:?}/release-canary-queue"
          sudo install -d -m 0700 -o 10001 -g 10001 "$queue_directory"
          export AXIOM_TOKEN="$AXIOM_INGEST_TOKEN"
          docker run -d --name otel-production \
            -p 127.0.0.1:24318:4318 -p 127.0.0.1:24319:13133 \
            -v "$queue_directory:/var/lib/otelcol/queue" \
            -e AXIOM_TOKEN \
            -e AXIOM_DATASET_TRACES -e AXIOM_DATASET_LOGS -e AXIOM_DATASET_METRICS \
            -v "$PWD/packages/cli/src/assets/production.yaml:/etc/otelcol/config.yaml:ro" \
            otel/opentelemetry-collector-contrib:0.159.0 --config=/etc/otelcol/config.yaml
          for _ in $(seq 1 30); do
            if [[ "$(docker inspect --format '{{.State.Running}}' otel-production)" != "true" ]]; then
              echo "The production Collector exited before becoming healthy. Review the startup diagnostics."
              exit 1
            fi
            if curl --fail --silent --show-error --connect-timeout 1 --max-time 2 -o /dev/null http://127.0.0.1:24319/health; then exit 0; fi
            sleep 1
          done
          echo "The production Collector did not become healthy after 30 attempts. Review the startup diagnostics."
          exit 1
      - name: Run the deployed release canary
        env:
          OBSERVABILITY_E2E_DEPLOYED: "1"
          OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:24318
          AXIOM_READ_TOKEN: ${{ secrets.AXIOM_READ_TOKEN }}
          AXIOM_ORGANIZATION_ID: ${{ vars.AXIOM_ORGANIZATION_ID }}
          AXIOM_URL: ${{ vars.AXIOM_URL }}
          AXIOM_DATASET_TRACES: ${{ vars.AXIOM_DATASET_TRACES }}
          AXIOM_DATASET_LOGS: ${{ vars.AXIOM_DATASET_LOGS }}
          AXIOM_DATASET_METRICS: ${{ vars.AXIOM_DATASET_METRICS }}
        run: |
          bun scripts/release-canary.ts --require-credential AXIOM_READ_TOKEN
          bun run test:canary:deployed
      - name: Report failed canary Collector logs
        if: failure()
        run: docker logs --tail 100 otel-production 2>&1 || true
      - name: Clean the production collector
        if: always()
        run: |
          docker rm -f otel-production 2>/dev/null || true
          sudo rm -rf -- "${RUNNER_TEMP:?}/release-canary-queue"

  canary-gate:
    if: ${{ !cancelled() }}
    needs: deployed-canary
    runs-on: ubuntu-latest
    steps:
      - env:
          DEPLOYED_CANARY_RESULT: ${{ needs.deployed-canary.result }}
        run: test "$DEPLOYED_CANARY_RESULT" = "success"

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [tag-check, verify, canary-gate]
    runs-on: ubuntu-latest
    environment: publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the isolated release candidate
        env:
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          slug="${TAG%@*}"
          version="${TAG#*@}"
          bun scripts/release-candidate.ts --package "$slug" --version "$version" --output dist-release
          (cd dist-release && sha256sum --check "${TAG}.sha256")
      - name: Generate release notes
        env:
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          if [[ -f "docs/releases/${TAG}.md" ]]; then cp "docs/releases/${TAG}.md" release-notes.md; else bun scripts/release-notes.ts --tag "$TAG" > release-notes.md; fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          PRERELEASE: ${{ needs.tag-check.outputs.prerelease }}
          ARCHIVE: ${{ needs.tag-check.outputs.archive }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file release-notes.md --verify-tag)
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
            gh "${args[@]}"
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "dist-release/$ARCHIVE" --clobber
      - name: Verify the exact release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          ARCHIVE: ${{ needs.tag-check.outputs.archive }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "$ARCHIVE"
      - if: always()
        run: rm -rf dist-release release-notes.md

  publish-npm:
    if: github.event_name == 'workflow_dispatch'
    needs: [tag-check, release]
    runs-on: ubuntu-latest
    environment: publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Download and verify the selected package archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          ARCHIVE: ${{ needs.tag-check.outputs.archive }}
        run: |
          set -euo pipefail
          slug="${TAG%@*}"
          version="${TAG#*@}"
          bun scripts/release-candidate.ts --package "$slug" --version "$version" --output .release-candidate
          mkdir dist-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ARCHIVE" --dir dist-release
          (cd .release-candidate && sha256sum --check "${TAG}.sha256")
          cmp ".release-candidate/$ARCHIVE" "dist-release/$ARCHIVE"
      - name: Publish the selected package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ARCHIVE: ${{ needs.tag-check.outputs.archive }}
          NPM_TAG: ${{ needs.tag-check.outputs.npm_tag }}
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          slug="${TAG%@*}"
          version="${TAG#*@}"
          package_name="@equipe-tech/$slug"
          state="$(bun scripts/npm-publication-state.ts "$package_name" "$version")"
          if [[ "$state" == "published" ]]; then exit 0; fi
          [[ -n "$NODE_AUTH_TOKEN" ]] || { echo "NPM_TOKEN is required for publication."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "GitHub OIDC request URL is unavailable."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || { echo "GitHub OIDC request token is unavailable."; exit 1; }
          npm whoami --registry https://registry.npmjs.org
          npm publish "dist-release/$ARCHIVE" --access public --tag "$NPM_TAG" --provenance
      - if: always()
        run: rm -rf .release-candidate dist-release
