name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag existente exata a publicar (exemplo: v0.2.1)"
        required: true
        type: string
      confirm_tag:
        description: "Repita exatamente o tag aprovado para confirmar a publicação"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tag-check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag against the package manifests
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          CONFIRM_TAG: ${{ inputs.confirm_tag || '' }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$CONFIRM_TAG" == "$tag" ]] \
              || { echo "Publication confirmation must exactly match $tag."; exit 1; }
            [[ "$EVENT_REF" == "refs/tags/$tag" ]] \
              || { echo "Publication dispatch must run from the exact tag ref refs/tags/$tag."; exit 1; }
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] \
            || { echo "The tag $tag does not match the release tag format."; exit 1; }
          git show-ref --verify --quiet "refs/tags/$tag" \
            || { echo "The tag $tag does not exist in this checkout."; exit 1; }
          tag_commit="$(git rev-list -n 1 "$tag")"
          head_commit="$(git rev-parse HEAD)"
          [[ "$head_commit" == "$tag_commit" ]] \
            || { echo "HEAD $head_commit is not the exact commit for $tag ($tag_commit)."; exit 1; }
          version="${tag#v}"
          for manifest in packages/telemetry/package.json packages/cli/package.json; do
            manifest_version="$(jq -r .version "$manifest")"
            [[ "$manifest_version" == "$version" ]] \
              || { echo "The tag $tag does not match $manifest ($manifest_version)."; exit 1; }
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            suffix="${version#*-}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=${suffix%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: tag-check
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.tag-check.outputs.tag }}
      run_deployed_canary: false

  release:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - tag-check
      - verify
    runs-on: ubuntu-latest
    environment: publication
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Pack and verify release tarballs
        env:
          TAG: ${{ needs.tag-check.outputs.tag }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .release-pack dist-release
          trap 'rm -rf .release-pack' EXIT
          for pack_set in pack-1 pack-2 pack-3; do
            destination="$PWD/.release-pack/$pack_set"
            mkdir -p "$destination"
            (cd packages/telemetry && bun pm pack --ignore-scripts --quiet \
              --filename "$destination/equipe-tech-observability-${VERSION}.tgz")
            (cd packages/cli && bun pm pack --ignore-scripts --quiet \
              --filename "$destination/equipe-tech-observability-cli-${VERSION}.tgz")
          done
          for pack_set in pack-2 pack-3; do
            cmp ".release-pack/pack-1/equipe-tech-observability-${VERSION}.tgz" \
              ".release-pack/$pack_set/equipe-tech-observability-${VERSION}.tgz"
            cmp ".release-pack/pack-1/equipe-tech-observability-cli-${VERSION}.tgz" \
              ".release-pack/$pack_set/equipe-tech-observability-cli-${VERSION}.tgz"
          done
          checksum_file="docs/releases/${TAG}.sha256"
          [[ -f "$checksum_file" ]] \
            || { echo "The release checksum file is missing: $checksum_file"; exit 1; }
          sha256sum --check "$checksum_file"
          mkdir dist-release
          cp .release-pack/pack-1/*.tgz dist-release/
          rm -rf .release-pack
          ls -l dist-release
      - name: Generate release notes
        env:
          TAG: ${{ needs.tag-check.outputs.tag }}
        run: |
          set -euo pipefail
          source_notes="docs/releases/${TAG}.md"
          if [[ -f "$source_notes" ]]; then
            cp "$source_notes" release-notes.md
          else
            bun scripts/release-notes.ts --tag "$TAG" > release-notes.md
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          PRERELEASE: ${{ needs.tag-check.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $TAG already exists. Existing assets will not be replaced."
          else
            create_args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes-file release-notes.md --verify-tag)
            if [[ "$PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" dist-release/*
          fi
      - name: Verify the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for expected in \
            "equipe-tech-observability-${VERSION}.tgz" \
            "equipe-tech-observability-cli-${VERSION}.tgz"; do
            grep -qx "$expected" <<< "$assets" \
              || { echo "The release is missing the asset $expected."; exit 1; }
          done
      - name: Clean release temporary paths
        if: always()
        run: rm -rf .release-pack dist-release release-notes.md

  publish-npm:
    if: github.event_name == 'workflow_dispatch'
    needs:
      - tag-check
      - release
    runs-on: ubuntu-latest
    environment: publication
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag-check.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Download, rebuild, and verify the release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag-check.outputs.tag }}
          VERSION: ${{ needs.tag-check.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf .release-pack dist-release
          trap 'rm -rf .release-pack' EXIT
          mkdir dist-release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.tgz" --dir dist-release
          for pack_set in pack-1 pack-2 pack-3; do
            destination="$PWD/.release-pack/$pack_set"
            mkdir -p "$destination"
            (cd packages/telemetry && bun pm pack --ignore-scripts --quiet \
              --filename "$destination/equipe-tech-observability-${VERSION}.tgz")
            (cd packages/cli && bun pm pack --ignore-scripts --quiet \
              --filename "$destination/equipe-tech-observability-cli-${VERSION}.tgz")
          done
          for pack_set in pack-2 pack-3; do
            cmp ".release-pack/pack-1/equipe-tech-observability-${VERSION}.tgz" \
              ".release-pack/$pack_set/equipe-tech-observability-${VERSION}.tgz"
            cmp ".release-pack/pack-1/equipe-tech-observability-cli-${VERSION}.tgz" \
              ".release-pack/$pack_set/equipe-tech-observability-cli-${VERSION}.tgz"
          done
          checksum_file="docs/releases/${TAG}.sha256"
          [[ -f "$checksum_file" ]] \
            || { echo "The release checksum file is missing: $checksum_file"; exit 1; }
          sha256sum --check "$checksum_file"
          cmp ".release-pack/pack-1/equipe-tech-observability-${VERSION}.tgz" \
            "dist-release/equipe-tech-observability-${VERSION}.tgz"
          cmp ".release-pack/pack-1/equipe-tech-observability-cli-${VERSION}.tgz" \
            "dist-release/equipe-tech-observability-cli-${VERSION}.tgz"
          rm -rf .release-pack
      - name: Validate npm authentication and trusted publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$NODE_AUTH_TOKEN" ]] \
            || { echo "NPM_TOKEN is required for publication."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] \
            || { echo "GitHub OIDC request URL is unavailable."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] \
            || { echo "GitHub OIDC request token is unavailable."; exit 1; }
          npm whoami --registry https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.tag-check.outputs.version }}
          NPM_TAG: ${{ needs.tag-check.outputs.npm_tag }}
        run: |
          set -euo pipefail
          [[ -n "$NODE_AUTH_TOKEN" ]] \
            || { echo "NPM_TOKEN is required for publication."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] \
            || { echo "GitHub OIDC request URL is unavailable."; exit 1; }
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] \
            || { echo "GitHub OIDC request token is unavailable."; exit 1; }
          for tarball in \
            "./dist-release/equipe-tech-observability-${VERSION}.tgz" \
            "./dist-release/equipe-tech-observability-cli-${VERSION}.tgz"; do
            [[ -f "$tarball" ]] || { echo "Missing tarball: $tarball"; exit 1; }
            set +e
            output="$(npm publish "$tarball" --access public --tag "$NPM_TAG" --provenance 2>&1)"
            status=$?
            set -e
            echo "$output"
            if [[ $status -ne 0 ]]; then
              if grep -qiE "previously published|cannot publish over|version already exists" <<< "$output"; then
                echo "Skipping the already published version in $tarball."
                continue
              fi
              exit $status
            fi
          done
      - name: Clean npm publication temporary paths
        if: always()
        run: rm -rf .release-pack dist-release
