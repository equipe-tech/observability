name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package slug"
        required: true
        type: string
      version:
        description: "Exact package version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Validate the selected release
        env:
          SLUG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest=""
          for candidate in packages/*/package.json; do
            if [[ "$(jq -r .name "$candidate" | sed 's#^@equipe-tech/##')" == "$SLUG" ]]; then manifest="$candidate"; break; fi
          done
          [[ -n "$manifest" ]] || { echo "Unknown package $SLUG."; exit 1; }
          [[ "$(jq -r .version "$manifest")" == "$VERSION" ]] || { echo "Version $VERSION does not match $manifest."; exit 1; }
          tag="$SLUG@$VERSION"
          bun scripts/release.ts "$VERSION" --package "$SLUG" --dry-run
          test -s "docs/releases/${tag}.md"
          test -s "docs/releases/${tag}.sha256"
          bun run test:package
          npm view "$(jq -r .name "$manifest")" version dist-tags versions --json || true
