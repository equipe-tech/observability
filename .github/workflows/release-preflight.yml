name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package slug"
        required: true
        type: string
      version:
        description: "Exact package version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.package }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Resolve the selected release
        env:
          SLUG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: bun scripts/release-canary.ts --tag "$SLUG@$VERSION" --github-env "$GITHUB_ENV"
      - name: Validate the selected release
        env:
          SLUG: ${{ inputs.package }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun scripts/release.ts "$VERSION" --package "$SLUG" --dry-run
          bun run build
          OBSERVABILITY_COMPATIBILITY_DATE="$(date -u +%F)" bun run compat --release "$SLUG@$VERSION"
          output="$RUNNER_TEMP/release-candidate"
          bun scripts/release-candidate.ts --package "$SLUG" --version "$VERSION" --output "$output"
          test -s "$output/$SLUG@$VERSION.md"
          test -s "$output/$SLUG@$VERSION.sha256"
          (cd "$output" && sha256sum --check "$SLUG@$VERSION.sha256")
          bun run test:package
          bun scripts/npm-publication-state.ts "$RELEASE_PACKAGE_NAME" "$VERSION"
